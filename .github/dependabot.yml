version: 2
updates:
  # Node.js / TypeScript dependencies (package.json)
  - package-ecosystem: "npm"
    directory: "/" # Change if package.json is in a subfolder (e.g., "/cep" or "/src")
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Groups minor/patch updates to avoid PR spam for @types/* and build tools
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions workflows up to date (optional, remove if unused)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
